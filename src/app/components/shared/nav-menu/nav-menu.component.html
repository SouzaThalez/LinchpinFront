
<div class="sub-menu-container">
    <div class="sub-menu-list">
        <div class="menu-item"  
             routerLink="/private/{{pageType}}/{{alink}}"
             routerLinkActive="active">
            <span class="material-symbols-outlined menu-icon">fit_screen</span>
            <span [innerHTML]="alink"></span>
        </div>
        <div class="menu-item"
             routerLink="/private/{{pageType}}/{{blink}}"
             routerLinkActive="active">
             <span class="material-symbols-outlined menu-icon">fit_screen</span>
             <span [innerHTML]="blink"></span>
        </div>
        <div class="menu-item"
             routerLink="/private/{{pageType}}/{{clink}}"
             routerLinkActive="active"
             *ngIf="clink != ''">
             <span class="material-symbols-outlined menu-icon">fit_screen</span>
             <span [innerHTML]="clink"></span>
        </div>
    </div>
</div>
